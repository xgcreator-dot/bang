@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182941;font:14px 'DM Sans','Noto Sans SC',sans-serif}.side{position:fixed;inset:0 auto 0 0;width:225px;background:#fff;border-right:1px solid #e8edf4;padding:21px 14px}.brand{font-weight:800;font-size:17px;padding:0 9px 27px}.brand i{font-style:normal;background:#345eea;color:white;padding:8px 9px;border-radius:9px;margin-right:8px}.brand small{display:block;color:#9aa6b6;font-size:9px;letter-spacing:1px;margin:8px 0 0 43px}.label{font-size:10px;color:#a0abba;padding:10px}.nav{display:block;color:#6c7b91;text-decoration:none;padding:11px;border-radius:8px;font-size:12px;margin:3px 0}.nav.on{background:#edf2ff;color:#345eea;font-weight:700}.nav:hover{background:#f4f6fa}.back{position:absolute;bottom:20px;left:22px;color:#708099;text-decoration:none;font-size:11px}.main{margin-left:225px}.top{height:62px;background:white;border-bottom:1px solid #e8edf4;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#8290a3;font-size:11px}.top b{color:#33435a}.content{padding:28px 30px;max-width:1450px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.title h1{font-size:22px;margin:0 0 5px}.title p{font-size:11px;color:#8694a7;margin:0}.btn{border:0;background:#345eea;color:white;border-radius:7px;padding:10px 13px;font-size:11px;font-weight:700}.btn2{background:white;color:#64748a;border:1px solid #e4e9f0;border-radius:7px;padding:9px 12px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.stat,.panel{background:white;border:1px solid #e8edf4;border-radius:11px;box-shadow:0 7px 22px #22395b08}.stat{padding:16px}.stat span{font-size:11px;color:#8090a5}.stat strong{display:block;font-size:25px;margin-top:10px}.stat small{font-size:10px;color:#18a276}.panel-head{padding:16px 17px;display:flex;justify-content:space-between;align-items:center}.panel-head b{font-size:13px}.filters{padding:0 17px 14px;display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{height:34px;border:1px solid #e5eaf1;border-radius:7px;padding:0 10px;font-size:11px;color:#687990;background:white}.filters input{width:245px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:740px}th{background:#fafbfd;color:#97a3b2;text-align:left;font-weight:600;font-size:10px;padding:11px 14px}td{border-top:1px solid #f0f2f6;padding:13px 14px;font-size:11px;color:#56667c}td b{color:#26374f;font-size:11px}.pill{padding:4px 7px;border-radius:5px;font-size:9px;background:#eaf7f1;color:#15966d}.pill.gold{background:#fff4e4;color:#c78225}.pill.gray{background:#f0f2f5;color:#728096}.act{border:0;background:none;color:#345eea;font-size:10px}.foot{padding:13px 17px;color:#99a5b3;font-size:10px;border-top:1px solid #edf0f4}.modalbg{position:fixed;inset:0;background:#17253b77;display:none;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:white;border-radius:13px;padding:22px;width:min(430px,100%)}.modal h3{margin:0 0 18px}.modal label{display:block;font-size:11px;margin:12px 0 5px;color:#617087}.modal input,.modal select{width:100%;height:36px;border:1px solid #e5eaf1;border-radius:7px;padding:0 9px}.modal .btn{width:100%;margin-top:17px}.close{float:right;border:0;background:#f2f4f8;border-radius:6px;padding:5px 9px}@media(max-width:800px){.side{width:62px;padding:15px 6px}.brand{font-size:0;padding:5px 4px 24px}.brand i{font-size:14px}.brand small,.label{display:none}.nav{font-size:0;text-align:center;padding:12px}.nav:before{content:'•';font-size:18px}.back{font-size:0;left:19px}.back:after{content:'↩';font-size:16px}.main{margin-left:62px}.content{padding:20px 13px}.top{padding:0 14px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><aside class="side"><div class="brand"><i>标</i>标讯通<small>ADMIN CONSOLE</small></div><div class="label">运营管理</div><a class="nav" href="index.html">工作台</a><a class="nav on" href="members.html">会员管理</a><a class="nav" href="members.html">会员等级</a><a class="nav" href="members.html">服务订单</a><a class="nav" href="members.html">使用记录</a><div class="label">快捷切换</div><a class="nav" href="tenders.html">公开招标信息</a><a class="nav" href="maintenance.html">系统维护</a><a class="nav" href="collection.html">数据采集管理</a><a class="back" href="index.html">← 返回平台总入口</a></aside><main class="main"><header class="top">运营管理　/　<b>会员管理</b><span>管理员　·　运营中心</span></header><div class="content"><div class="title"><div><h1>会员管理</h1><p>管理会员档案、服务等级、有效期及账号状态</p></div><div><button class="btn2" id="export">导出名单</button> <button class="btn" id="add">＋ 新增会员</button></div></div><div class="stats"><div class="stat"><span>会员总数</span><strong>12,846</strong><small>↑ 8.2% 本月</small></div><div class="stat"><span>有效会员</span><strong>10,284</strong><small>占比 80.1%</small></div><div class="stat"><span>本月新增</span><strong>486</strong><small>↑ 12.6% 较上月</small></div><div class="stat"><span>即将到期</span><strong>128</strong><small style="color:#cf8828">未来 30 天</small></div></div><section class="panel"><div class="panel-head"><b>会员档案</b><span style="font-size:10px;color:#95a1b0">支持按姓名、手机号、会员编号检索</span></div><div class="filters"><input id="q" placeholder="搜索姓名、手机号或会员编号"><select id="level"><option value="">全部等级</option><option>专业版</option><option>企业版</option><option>基础版</option></select><select id="status"><option value="">全部状态</option><option>正常</option><option>即将到期</option><option>已停用</option></select><button class="btn2" id="clear">重置筛选</button></div><div class="table"><table><thead><tr><th>会员信息</th><th>会员等级</th><th>账号状态</th><th>加入时间</th><th>服务到期</th><th>近30日登录</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot" id="count"></div></section></div></main><div class="modalbg" id="mb"><div class="modal"><button class="close" id="close">×</button><h3>新增会员</h3><label>会员姓名</label><input id="name" placeholder="请输入姓名"><label>手机号</label><input id="phone" placeholder="请输入手机号"><label>初始登录密码（至少8位）</label><input id="memberPassword" type="password" placeholder="设置初始密码"><label>会员等级</label><select id="newlevel"><option>基础版</option><option>专业版</option><option>企业版</option></select><button class="btn" id="save">创建会员账号</button></div></div><script>
let data=[['王晓明','138****2601','企业版','正常','2025-08-12','2027-08-11','24'],['陈女士','139****5816','专业版','正常','2025-10-03','2026-11-30','18'],['李建国','186****0927','专业版','即将到期','2024-11-22','2026-11-15','9'],['上海某某科技有限公司','021****8812','企业版','正常','2025-06-19','2027-06-18','31'],['赵先生','137****1430','基础版','已停用','2025-03-08','2026-03-07','0'],['周敏','158****6052','基础版','正常','2026-01-14','2027-01-13','12'],['孙建华','135****2791','专业版','正常','2025-12-20','2026-12-19','16']];const rows=document.querySelector('#rows');function render(){let q=document.querySelector('#q').value,level=document.querySelector('#level').value,status=document.querySelector('#status').value;let list=data.filter(x=>(!q||x.join(' ').includes(q))&&(!level||x[2]===level)&&(!status||x[3]===status));rows.innerHTML=list.map((x,i)=>`<tr><td><b>${x[0]}</b><br><span style="font-size:10px;color:#9aa6b4">${x[1]} · M${String(10028+i).padStart(6,'0')}</span></td><td>${x[2]}</td><td><span class="pill ${x[3]==='即将到期'?'gold':x[3]==='已停用'?'gray':''}">${x[3]}</span></td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]} 次</td><td><button class="act" data-i="${i}">查看</button>　<button class="act" data-i="${i}">编辑</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:35px;color:#9aa6b4">没有符合条件的会员</td></tr>';document.querySelector('#count').textContent=`当前展示 ${list.length} 条会员记录 · 演示数据`};document.querySelectorAll('.filters input,.filters select').forEach(e=>e.addEventListener('input',render));document.querySelector('#clear').onclick=()=>{document.querySelector('#q').value='';document.querySelector('#level').value='';document.querySelector('#status').value='';render()};let mb=document.querySelector('#mb');document.querySelector('#add').onclick=()=>mb.classList.add('show');document.querySelector('#close').onclick=()=>mb.classList.remove('show');document.querySelector('#save').onclick=()=>{let n=document.querySelector('#name').value,p=document.querySelector('#phone').value;if(!n||!p){alert('请填写姓名和手机号');return}data.unshift([n,p,document.querySelector('#newlevel').value,'正常',new Date().toISOString().slice(0,10),'2027-11-04','0']);mb.classList.remove('show');render();alert('会员已加入演示名单')};document.querySelector('#export').onclick=()=>alert('演示原型：正式版可导出筛选后的会员名单');render();
</script><script src="app.js"></script></body></html>
